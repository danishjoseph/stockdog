name: Stockdog CI

env:
  NODE_VERSION: lts/*

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  issues: write
  pull-requests: write

jobs:
  test:
    name: Unit tests & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Install test dependencies
        run: yarn install

      - name: Lint code
        run: yarn nx run-many -t lint

      - name: Run Unit tests
        run: yarn nx run-many -t test

  build:
    name: Publish Docker image
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [backend, dashboard]

    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install package dependencies
        run: yarn install

      - name: Set up Go and install jb (for dashboard only)
        if: matrix.app == 'dashboard'
        uses: actions/setup-go@v5
        with:
          cache: false
          go-version: 1.22.x

      - name: Install jb and jsonnet (for dashboard only)
        if: matrix.app == 'dashboard'
        run: |
          go install github.com/jsonnet-bundler/jsonnet-bundler/cmd/jb@latest
          echo "${HOME}/go/bin" >> $GITHUB_PATH
          # Install jsonnet
          sudo apt-get update
          sudo apt-get install -y jsonnet

      - name: Run jsonnet-bundler (jb)
        if: matrix.app == 'dashboard'
        run: yarn nx run ${{ matrix.app }}:install

      - name: Build application bundle
        run: yarn nx run ${{ matrix.app }}:build

      - name: Upload build artifacts
        if: matrix.app == 'dashboard' # Specify condition if needed
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: ./dist

      - name: Generate version number
        id: version
        run: |
          version=$(cat ./package.json | jq -r '.version')
          # Determine the tag prefix based on the branch context
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            tag="${{ secrets.DOCKER_HUB_USERNAME }}/stockdog:${{ matrix.app }}-v-$version"
          else
            tag="${{ secrets.DOCKER_HUB_USERNAME }}/stockdog:${{ matrix.app }}-dev"
          fi
          # Print out the tag for later steps
          echo "tag=$tag" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push multi-platform image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/${{ matrix.app }}/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.version.outputs.tag }}
