apiVersion: 1

datasources:
  - name: grafana-postgresql-datasource
    type: postgres
    access: proxy
    url: $DB_HOST:$DB_PORT
    database: $DB_NAME
    user: $DB_USERNAME
    secureJsonData:
      password: $DB_PASSWORD
    uid: edjh8vws68hdse
    jsonData:
      sslmode: disable # Add this line to disable SSL
    isDefault: true
